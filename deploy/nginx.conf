# Reverse proxy in front of the Nuxt server.
# For a public domain, enable the TLS server block and point certificates
# at your files (e.g. from certbot).

upstream you2sync {
  server app:3000;
  keepalive 8;
}

server {
  listen 80;
  server_name _;

  # Small JSON API; the only large body is the YouTube Music cookie.
  client_max_body_size 64k;

  # Hashed build assets never change; cache them for a year.
  location /_nuxt/ {
    proxy_pass http://you2sync;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://you2sync;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}

